# Menschliche Prüfschritte (Stufe 3) — nur, was Tests nicht sehen können:
# Optik und der Shell-Modus, der von der Agent-Einstellung des Fensters abhängt.
schritte:
  - id: 1
    stufe: 3
    text: >-
      Projektfenster Speccify mit Claude im Terminal, Spec anklicken → „Auftrag…“ →
      „Ins Terminal einfügen“.
    erwartung: >-
      Das Terminal kommt sichtbar nach vorn, der Text steht als ein Block in Claudes
      Eingabezeile, nichts ist abgeschickt; nach Enter beginnt Claude mit dem Auftrag
      und kennt Projekt, Spec und Inhalt.
  - id: 2
    stufe: 3
    text: >-
      Terminal mit „Nur Shell“ starten, Auftrag einfügen.
    erwartung: >-
      Mehrzeiliger Text steht in der zsh-Eingabezeile, keine Zeile wurde ausgeführt,
      keine Escape-Zeichen sichtbar.
